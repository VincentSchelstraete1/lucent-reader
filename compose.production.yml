services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lucent}
      POSTGRES_USER: ${POSTGRES_USER:-lucent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - lucent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lucent} -d ${POSTGRES_DB:-lucent}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${PUBLIC_API_ORIGIN:?set PUBLIC_API_ORIGIN}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:?set SUPPORT_EMAIL}
        VITE_POLICY_EFFECTIVE_DATE: ${POLICY_EFFECTIVE_DATE:?set POLICY_EFFECTIVE_DATE}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  lucent-postgres:
