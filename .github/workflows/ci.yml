name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
      - name: Test release configuration
        run: pnpm test
      - name: Build production extension
        run: pnpm build
      - name: Package production extension
        run: pnpm package

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lucent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lucent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/lucent
      ALLOWED_ORIGINS: http://testserver
      API_ORIGIN: http://testserver
      ANTHROPIC_API_KEY: ci-placeholder-not-used
      LEARN_TUTOR_MODEL_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration head
        working-directory: backend
        run: test "$(alembic current 2>/dev/null | tail -1)" = "$(alembic heads 2>/dev/null | tail -1)"
      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test -- --run
      - name: Build production frontend
        env:
          VITE_API_URL: https://api.example.invalid
        run: npm run build
